<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieVerse</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./CSS/main.css" />
  </head>

  <body class="bg-dark text-white">
    <!-- NAVBAR -->
    <header class="w-100 top-0 z-3 sticky-top">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
          <a class="nav-header text-white navbar-brand fw-bolder" href="#">MovieVerse</a>
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
          </button>
          
          <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link active fw-bold" href="#home">Home</a></li>
              <li class="nav-item"><a class="nav-link fw-bold" href="#rows">Browse</a></li>
            </ul>
            
            <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0">
              <input type="search" id="searchInput" class="form-control form-control-sm bg-transparent text-white border-secondary" placeholder="Search movies..." />
              
              <div id="authSection" class="d-flex gap-2">
                <a href="./HTML/login.html" class="btn btn-outline-light btn-sm">Login</a>
                <a href="./HTML/signup.html" class="btn btn-primary btn-sm">Sign Up</a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- HERO CAROUSEL -->
    <section id="heroCarousel" class="hero-carousel"></section>

    <!-- MOVIE ROWS -->
    <main id="rows" class="mt-4 px-4">
      <div id="loader" class="text-center py-5">
        <div class="spinner-border text-light"></div>
      </div>
      
      <section class="movie-section">
        <div class="section-header">
          <h2>Trending</h2>
          <div class="slider-controls">
            <button class="prev-btn">❮</button>
            <button class="next-btn">❯</button>
          </div>
        </div>
        <div id="trendingMovies"></div>
      </section>

      <section class="movie-section">
        <div class="section-header">
          <h2>Popular</h2>
          <div class="slider-controls">
            <button class="prev-btn">❮</button>
            <button class="next-btn">❯</button>
          </div>
        </div>
        <div id="popularMovies"></div>
      </section>

      <section class="movie-section">
        <div class="section-header">
          <h2>Top Rated</h2>
          <div class="slider-controls">
            <button class="prev-btn">❮</button>
            <button class="next-btn">❯</button>
          </div>
        </div>
        <div id="topRatedMovies"></div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer mt- border-top border-secondary">
      <div class="container-fluid px-5 py-5">
        <div class="row">
          <div class="col-md-4 mb-4">
            <h5 class="text-primary fw-bold">MovieVerse</h5>
            <p class="text-secondary">Discover, track, and explore your favorite movies.</p>
          </div>
        </div>
        <hr class="border-secondary" />
        <p class="text-center text-secondary m-0">© 2026 MovieVerse. All rights reserved.</p>
      </div>
    </footer>

    <!-- UTILITIES -->
    <div id="toast" class="toast-box"></div>
    <button id="scrollTopBtn" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4" style="display: none;">↑</button>

    <!-- TRAILER MODAL (MUST BE HERE FOR THE POPUP TO WORK) -->
    <div class="modal fade" id="trailerModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title text-white">Trailer</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0">
            <div class="ratio ratio-16x9" id="trailerContainer">
              <!-- Video injects here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./JavaScript/app.js"></script>
  </body>
</html>
